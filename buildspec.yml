version: 0.2

phases:
  install:
    commands:
      - echo "Installing dependencies..."
  
  pre_build:
    commands:
      - echo "Running pre-build checks..."
      - test -f index.html
      - test -f error.html

  build:
    commands:
      - echo "Building website..."
      - mkdir -p build
      - cp index.html build/
      - cp error.html build/
      - cp -r css build/ || true
      - cp -r js build/ || true

  post_build:
    commands:
      - echo "Build completed successfully."

artifacts:
  files:
    - '**/*'
  base-directory: build
